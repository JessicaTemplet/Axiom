name: Reuse successful gate results
description: Restore or save content-checked gate results, including passes from a failed job.
inputs:
  mode:
    description: restore or save
    default: restore
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.mode == 'restore'
      with:
        path: ${{ github.workspace }}/.axiom-ci/results
        key: axiom-gates-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          axiom-gates-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Enable input-checked reuse
      if: inputs.mode == 'restore'
      shell: bash
      run: echo "AXIOM_CI_CACHE=$GITHUB_WORKSPACE/.axiom-ci/results" >> "$GITHUB_ENV"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ !cancelled() && inputs.mode == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/trunk' }}
      with:
        path: ${{ github.workspace }}/.axiom-ci/results
        key: axiom-gates-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
